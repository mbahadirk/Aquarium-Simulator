world:
  width: 1280
  height: 720

food:
  spawn_rate: 0.15
  max_count: 60
  drift_speed: 0.4
  energy_value: 40
  lifetime: 900

super_food:
  spawn_rate: 0.005
  max_count: 5
  energy_value: 50
  speed_boost_amount: 1.8      # multiplier on max_speed
  speed_boost_duration: 600    # steps (= 10 seconds at 60 fps)
  drift_speed: 0.3
  lifetime: 1200

predator:
  spawn_rate: 0.003
  max_count: 2
  speed: 1.3
  detection_radius: 180
  kill_radius: 14
  max_kills: 6
  lifetime: 1200

agent:
  initial_count: 30
  max_count: 120
  min_population: 15
  speed: 3.0
  detection_radius: 180
  eat_radius: 18
  initial_energy: 120.0
  energy_decay: 0.03          # base decay per step
  reproduction_threshold: 160.0
  reproduction_cost: 60
  reproduction_energy_reward: 30.0   # energy bonus on successful mating
  reproduction_cooldown: 100
  bite_penalty: 65.0
  bite_cooldown_steps: 80
  danger_signal_range: 90.0
  signal_range: 300.0
  signal_flee_force: 0.4
  sprint_threshold: 0.72      # brain output magnitude above which sprint activates
  sprint_multiplier: 1.7      # speed × this when sprinting
  sprint_energy_cost: 0.12    # extra energy per step while sprinting
  critical_energy: 35.0       # energy level considered dangerous
  low_energy_penalty: 0.06    # extra drain per step below critical_energy

genetics:
  mutation_rate: 0.08
  mutation_strength: 0.12
  crossover_type: "uniform"

brain:
  input_size: 34
  hidden_sizes: [32, 16]
  output_size: 2

memory:
  save_top_n: 10
  save_interval: 100

simulation:
  fps: 60
  seed_from_saved: true

logging:
  interval: 100
  log_file: "sim_logging/sim_log.csv"
